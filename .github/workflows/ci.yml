name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: data-stream_pipeline
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: data-stream_pipeline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U data-stream_pipeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://data-stream_pipeline:ci-password@localhost:5432/data-stream_pipeline
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Create .env (like a Coolify deployment - no fixed host ports)
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=ci-smoke-secret-ci-smoke-secret-ci-smoke/" .env
          # A server deployment sets no WEB_PORT/API_PORT/DB_PORT: Docker then publishes random free loopback ports.
          sed -i '/^\(WEB\|API\|DB\)_PORT=/d' .env
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Bring the whole system up from a clean clone
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test through the web container
        run: |
          set -e
          WEB="http://$(docker compose port web 80)"
          echo "web is on $WEB"
          curl -fsS "$WEB/health"
          curl -fsS "$WEB/ready"
          TOKEN=$(curl -fsS -X POST "$WEB/api/auth/login" \
            -H 'content-type: application/json' \
            -d '{"email":"ops1@example.com","password":"ops123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" "$WEB/api/episodes?limit=1" | grep -q '"total"'
      - if: failure()
        run: docker compose logs --no-color
