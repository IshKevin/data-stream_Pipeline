# ---- http-level settings (this file is included inside nginx's `http {}` block) ----------------------

server_tokens off;                      # don't advertise the nginx version

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
# (text/event-stream is deliberately NOT compressed: it must stream)
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

# Behind a TLS-terminating reverse proxy (Coolify/Traefik, a cloud load balancer, ...) the real client address
# arrives in X-Forwarded-For. Only trust it when the direct peer is on a private network, so internet clients
# cannot spoof it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Brute-force protection for the login endpoint: ~1 attempt/second per client address, bursts of 20 allowed.
limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
limit_req_status 429;

# Send HSTS only for requests that reached the proxy over HTTPS.
map $http_x_forwarded_proto $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;           # CSV imports

    include /etc/nginx/snippets/security-headers.conf;

    # Login: rate-limited, otherwise identical to the other API routes.
    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /health { proxy_pass http://api:8000/health; }
    location = /ready  { proxy_pass http://api:8000/ready; }

    # Hashed build assets can be cached forever; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
