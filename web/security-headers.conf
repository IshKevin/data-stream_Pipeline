# Included in every location that sets its own add_header (nginx does not inherit
# server-level add_header directives into a location that defines any).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS only when the proxy in front says the client used HTTPS ($hsts is empty otherwise -> header omitted).
add_header Strict-Transport-Security $hsts always;
# No inline scripts anywhere. Inline style *attributes* (React `style={{width: ..}}`) are allowed, <style> blocks are not.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
