name: data-stream_pipeline

x-api-env: &api-env
  # The app assembles (and URL-escapes) the database URL from these parts.
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-data-stream_pipeline}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-data-stream_pipeline}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (copy .env.example)}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# Containers that only run our own code: no root FS writes, no capabilities, no privilege escalation.
x-hardened: &hardened
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-data-stream_pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-data-stream_pipeline}
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory; mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      # Host ports are optional: with DB_PORT unset Docker picks a free random loopback port (`docker compose port db 5432`),
      # so this can never clash with another app on the server. Set DB_PORT in .env for a fixed local port.
      - "127.0.0.1:${DB_PORT:-}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-data-stream_pipeline} -d ${POSTGRES_DB:-data-stream_pipeline}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
      start_interval: 1s     # poll quickly while starting, then every `interval`
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # One-shot job: migrations + seed users + sample episodes. The API waits for it.
  migrate:
    <<: *hardened
    build:
      context: .                 # repo root, so the image can include seed/
      dockerfile: api/Dockerfile
      target: runtime
    command: ["sh", "bootstrap.sh"]
    environment:
      <<: *api-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *hardened
    build:
      context: .                 # repo root, so the image can include seed/
      dockerfile: api/Dockerfile
      target: runtime
    environment: *api-env
    ports:
      # Optional, loopback only (the API is normally reached through the web container). Unset -> random free port.
      # NB: port 8000 is Coolify's own dashboard port, so never default to it.
      - "127.0.0.1:${API_PORT:-}:8000"
    # `make dev` (docker compose up --watch): rebuild + restart the API when its code or lockfile changes.
    # Ignored by a plain `docker compose up`.
    develop:
      watch:
        - action: rebuild
          path: ./api/app
        - action: rebuild
          path: ./api/uv.lock
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
    init: true
    security_opt: ["no-new-privileges:true"]
    ports:
      # Behind Coolify/Traefik the proxy reaches this container over the Docker network on port 80, so no fixed host port is
      # needed. Unset WEB_PORT -> random free loopback port; .env.example sets WEB_PORT=8080 for local development.
      - "127.0.0.1:${WEB_PORT:-}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # `docker compose --profile test run --rm tests`  (see `make test`)
  tests:
    profiles: ["test"]
    build:
      context: .                 # repo root, so the image can include seed/
      dockerfile: api/Dockerfile
      target: test
    environment:
      <<: *api-env
    command: ["pytest"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
