name: data-stream_pipeline

x-api-env: &api-env
  # The app assembles (and URL-escapes) the database URL from these parts.
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (copy .env.example)}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot job: migrations + seed users + sample episodes. The API waits for it.
  migrate:
    build:
      context: ./api
      target: runtime
      additional_contexts:
        seed: ./seed   # sample data is baked into the image (no host bind mount needed)
    command: ["sh", "bootstrap.sh"]
    environment:
      <<: *api-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      target: runtime
      additional_contexts:
        seed: ./seed
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # `docker compose --profile test run --rm tests`  (see `make test`)
  tests:
    profiles: ["test"]
    build:
      context: ./api
      target: test
      additional_contexts:
        seed: ./seed
    environment:
      <<: *api-env
    command: ["pytest"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
