x-api-env: &api-env
  # The app assembles (and URL-escapes) the database URL from these parts.
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-desk}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-desk}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (copy .env.example)}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-desk}
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory; mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-desk} -d ${POSTGRES_DB:-desk}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot job: migrations + seed users + sample episodes. The API waits for it.
  migrate:
    build:
      context: .                 # repo root, so the image can include seed/
      dockerfile: api/Dockerfile
      target: runtime
    command: ["sh", "bootstrap.sh"]
    environment:
      <<: *api-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .                 # repo root, so the image can include seed/
      dockerfile: api/Dockerfile
      target: runtime
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # `docker compose --profile test run --rm tests`  (see `make test`)
  tests:
    profiles: ["test"]
    build:
      context: .                 # repo root, so the image can include seed/
      dockerfile: api/Dockerfile
      target: test
    environment:
      <<: *api-env
    command: ["pytest"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
