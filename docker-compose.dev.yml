# Development overlay:  make dev
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --watch
# Edits under api/app are synced into the running container and the API restarts (Compose "watch").
# The root filesystem has to be writable for the sync, so the read-only hardening is lifted here.
services:
  api:
    read_only: false
    environment:
      LOG_LEVEL: DEBUG
    develop:
      watch:
        - action: sync+restart
          path: ./api/app
          target: /app/app
        - action: rebuild          # dependency changes need a new image
          path: ./api/uv.lock
