[project]
name = "data-stream_pipeline"
version = "0.1.0"
description = "data-stream_Pipeline - internal platform API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1.3",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "argon2-cffi>=25.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.4",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() defaults; E501: the formatter owns line length

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
